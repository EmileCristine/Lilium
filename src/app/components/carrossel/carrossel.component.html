<div class="carousel-wrapper" *ngIf="listaFlores.length > 0">
    <div class="carousel-container">
        
        @if (mostrarBotoes) {
            <button class="carousel-btn prev" (click)="moverCarrossel(-1)" aria-label="Voltar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
        }

        <div class="carousel-track" #carousel>
            @for (flor of listaFlores; track flor.nome) {
                <app-card [flor]="flor"></app-card>
            }
        </div>

        @if (mostrarBotoes) {
            <button class="carousel-btn next" (click)="moverCarrossel(1)" aria-label="Avançar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        }
        
    </div>
</div>

<div class="no-results" *ngIf="listaFlores.length === 0">
    <p>Nenhuma flor encontrada para os filtros selecionados.</p>
</div>
