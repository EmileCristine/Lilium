<header [class]="headerClass()">
  <div class="logo">
    <img
      src="icons/logo.svg"
      alt="Logo"
      routerLink="/"
      (click)="closeMenu()"
    />
  </div>

  <button class="menu-toggle" (click)="toggleMenu()" aria-label="Menu">
    <span class="hamburger" [class.open]="isMenuOpen()"></span>
  </button>

  <nav class="nav" [class.nav-active]="isMenuOpen()">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()">
      Home
    </a>

    <a
      routerLink="/flores"
      routerLinkActive="active"
      (click)="closeMenu()">
      Flores
    </a>

    <a
      routerLink="/floriografia"
      routerLinkActive="active"
      (click)="closeMenu()">
      Floriografia
    </a>
  </nav>
</header>
