<div class="masonry">
  @for (coluna of colunas; track $index) {
    <div class="masonry-column">
      @for (flor of coluna; track flor.nome) {
        <div
          class="masonry-item"
          [routerLink]="['/flores', flor.nome.toLowerCase(), 'caracteristicas']"
        >
          @if (flor.cores && flor.cores.length > 0) {
            <img
              [src]="flor.cores[0].imagem || flor.cores[0].imgSemFundo"
              [alt]="flor.nome"
            />
          }

          <div class="masonry-overlay">
            <div class="overlay-text">
              <h3>
                {{ flor.nome }}
              </h3>

              <p>
                {{ flor.resume }}
              </p>
            </div>

            <button
              class="overlay-btn"
              [routerLink]="[
                '/flores',
                flor.nome.toLowerCase(),
                'caracteristicas',
              ]"
            >
              Ver Detalhes
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
